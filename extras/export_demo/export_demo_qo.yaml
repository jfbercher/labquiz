    yields \n- `reg.intercept_`  = {w0:.3f} and \n- `reg.coef_` =  {abs(w1):.3f}.\
    \ \nFor a new observation x = {x:.3f}, what would be the value predicted by the
    model?"
  propositions:
    - proposition: 'The predicted value is '
      label: ''
  variables:
    w0:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: -2.0561276487991136
    w1:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: -0.1783501903554115
    x:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: 1.3282254637226796
  label: q:quiz81
  category: test
quiz82:
  type: mcq-template
  question: "Consider the simple regression  model \n$$\ny = \\alpha x + \\beta\n\
    $$\nwith $\\alpha={round(a,3)}$ and $\\beta={round(b,3)}$"
  propositions:
    - label: eval1
      proposition: "For x={round(x,3)}, the prediction is {round(a,3)*round(x,3) +
        round(b,3) :.3f}  \n"
    - proposition: The slope is positive
      label: positive_slope
    - label: eval2
      proposition: For x={round(x2,3)}, the prediction is 
        {round(b,3)*round(x2,3) + round(a,3) :.3f}
  variables:
    a:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: -0.31234795955119354
    b:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: -0.03192730766032284
    x:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: 0.916281444619562
    x2:
      type: float
      structure: scalar
      engine: numpy rng.
      call: normal(0, 1)
      preview: -0.2360367947963653
  label: q:quiz82
  category: test
