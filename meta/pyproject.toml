[project]
name = "LabQuizBundle"
version = "0.9.4"
description = "LabQuiz bundle that includes LabQuiz, Quiz-Editor, and Quiz-Dash."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "J.-F. Bercher", email = "jf.bercher@esiee.fr" }
]

dependencies = [
    "labquiz==0.9.8",
    "quiz_editor==0.9.2",
    "quiz_dash==0.9.5.0"
]

keywords = ["quizzes", "jupyter"]

classifiers = [
    # État de développement (3 - Alpha, 4 - Beta, 5 - Production/Stable)
    "Development Status :: 4 - Beta",
    
    # Public cible
    "Intended Audience :: Education",
    "Intended Audience :: Developers",

    # LICENCE : Très important pour le badge "License"
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    # VERSIONS PYTHON : Très important pour le badge "Python versions"
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    
    # Environnement
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
"Homepage" = "https://github.com/jfbercher/labquiz"
"Bug Tracker" = "https://github.com/jfbercher/labquiz/issues"
"Documentation" = "https://github.com/jfbercher/labquiz#readme"
"Source" = "https://github.com/jfbercher/labquiz"